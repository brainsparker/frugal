name: DCO

# Every commit on a PR must carry a Developer Certificate of Origin
# sign-off (see CONTRIBUTING.md). Checked with plain git — the
# previously referenced dcoapp/action@v1 does not exist (dcoapp is a
# GitHub App, not an Action), which made this workflow fail on every PR.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Developer Certificate of Origin sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $(git log -1 --format='%h (%s)' "$sha") is missing a Signed-off-by trailer"
              missing=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA")
          if [ "$missing" -ne 0 ]; then
            echo "Fix with: git rebase --signoff origin/main && git push --force-with-lease"
            exit 1
          fi
          echo "all commits signed off"
