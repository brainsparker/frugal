name: Release

on:
  push:
    tags:
      - "v*"
  # Re-run only the npm + MCP Registry publish for an existing tag (e.g.
  # after a publish-step failure). Builds, signing, and the GitHub release
  # run only on tag push.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to npm + MCP Registry (e.g. v0.2.0)"
        required: true

permissions:
  contents: write
  id-token: write # required for keyless cosign via GitHub OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        if: github.event_name == 'push'
        with:
          go-version-file: go.mod

      - name: Run tests
        if: github.event_name == 'push'
        run: go test ./...

      - name: Build release binaries
        if: github.event_name == 'push'
        run: make release

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign binaries and checksums (keyless)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          cd dist
          for f in frugal-* SHA256SUMS; do
            cosign sign-blob --yes --bundle "${f}.sig" "${f}"
          done

      - name: Generate SBOMs (CycloneDX)
        if: github.event_name == 'push'
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/frugal.cdx.json

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      ### Publish the npm wrapper that bootstraps the Go binary on first
      ### run (`npx frugal-mcp …`). The wrapper downloads from the
      ### GitHub release we just uploaded, so order matters — keep this
      ### after the gh-release step.

      # npm trusted publishing (OIDC): needs id-token: write (above) and
      # npm >= 11.5.1. No registry-url / NODE_AUTH_TOKEN: a token (even
      # setup-node's placeholder) takes precedence over OIDC and fails
      # with EOTP on 2FA accounts.
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Stamp version into npm package + server.json
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "bad tag: $TAG"; exit 1; }
          V="${TAG#v}"
          node -e "const f='npm/package.json';const j=require('./'+f);j.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n');" "$V"
          jq --arg v "$V" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish npm wrapper
        working-directory: npm
        run: npm publish --access public --provenance

      ### Publish server metadata to the official MCP Registry. The
      ### Registry verifies the npm package's `mcpName` matches the
      ### server.json `name`, so this only works after the npm publish
      ### above succeeds.

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
