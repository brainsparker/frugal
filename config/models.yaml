# Routed search providers consumed by the frugal__search MCP tool.
# Each entry whose api_key_env is set in the operator's environment is
# registered at startup; the cheapest cost_per_call is the default route
# when the tool is called without an explicit `provider` argument.
#
# Free, keyless providers missing from an operator's copy of this file
# (wikipedia, marginalia, goreadability — entries with no api_key_env /
# base_url_env) are filled in from the defaults embedded in the binary at
# load time, so upgrades that ship a new zero-key provider reach existing
# installs without a config rewrite. Keyed and self-hosted providers are
# never defaulted in: an omitted paid provider is treated as deliberate,
# and `frugal mcp install` must not harvest secrets this file didn't
# authorize. To opt a keyless provider out for good, don't delete its
# entry — the overlay would just restore it — set `enabled: false` on it:
#
#   wikipedia:
#     enabled: false
#
# A disabled entry is a pure tombstone: it's never registered, earns no
# rack-rate credit in `frugal stats`, and needs no api_key_env /
# base_url. Any entry you do keep overrides the shipped default wholesale
# (the merge is per-provider, not per-field).
#
# Routing policy (optional). Without a `routing:` section every
# capability routes cheapest-first with automatic failover — the
# default. To change how a capability's provider chain is ordered:
#
#   routing:
#     search:
#       strategy: fast          # cheap (default) | fast | premium
#       order: [serper, searxng] # explicit preference; unlisted providers still fall back
#       deny: [youcom]           # never called — not by fallback, not even pinned
#
# strategy=fast ranks providers by this machine's own observed latency
# (from the local usage ledger, OK calls only) and falls back to cost
# order until enough history exists. strategy=premium prefers your
# premium-priced providers, list price descending. `order` wins over
# `strategy` when both are set.
#
# Spend caps and rate-limit cooldown (optional). Set daily_budget_usd on
# any provider to skip it once its spend for the current UTC day reaches
# that cap (counters reset at UTC midnight); zero or absent means no cap:
#
#   youcom:
#     api_key_env: YDC_API_KEY
#     cost_per_call: 0.005
#     daily_budget_usd: 2.50
#
# routing.cooldown is a top-level Go duration (e.g. 90s). After a provider
# returns a 429 it is skipped for this long. Invalid values warn and fall
# back to the 60s default:
#
#   routing:
#     cooldown: 90s
#
# Result size cap (optional). Set limits.max_chars to cap the page
# content (markdown + text + html, shared) that frugal__extract,
# frugal__browse, and frugal__execute return per call. Over the cap the
# tail is cut on a word boundary, a visible marker is appended, and the
# response reports truncated: true with chars_returned / chars_total so
# the agent can re-call with a larger per-call max_chars. Zero or absent
# means results are returned whole. 40000 chars is roughly 10k tokens,
# the point where Claude Code starts warning about MCP output size:
#
#   limits:
#     max_chars: 40000
#
# v1.0 ships only the search-tool layer. Chat-model routing and its
# pricing tables come back in Phase 2 with the frugal__chat MCP tool.
search_providers:
    # Free / local-first: a self-hosted SearXNG instance. CostPerCall is 0
    # so it sorts ahead of paid providers in the auto-router; the fallback
    # chain catches us automatically if the instance is down. Operators
    # set SEARXNG_URL to enable (https://docs.searxng.org/admin/installation.html).
    searxng:
        base_url_env: SEARXNG_URL
        cost_per_call: 0.0
    # Free / public: community-run indie-web search. No API key required;
    # the driver identifies itself via User-Agent per Marginalia etiquette.
    # Ties with SearXNG on cost (both 0) go to SearXNG — the operator
    # stood that instance up deliberately. YAML maps don't preserve file
    # order, so the tie-break comes from the canonical provider order in
    # the binary, not from this file's ordering.
    marginalia:
        base_url: https://api.marginalia.nu
        cost_per_call: 0.0
    # Free / public: Wikimedia REST search. No API key required; the
    # driver identifies itself via User-Agent per the Wikimedia robot
    # policy. Covers the mainstream entity / reference queries
    # Marginalia's indie-web index whiffs on — with zero-hit
    # fall-through the router visits both $0 providers before spending
    # a paid call. Sits after Marginalia in the canonical order.
    wikipedia:
        base_url: https://en.wikipedia.org
        cost_per_call: 0.0
    # Cheap paid fallback.
    serper:
        api_key_env: SERPER_API_KEY
        base_url: https://google.serper.dev
        cost_per_call: 0.001
    # Premium paid fallback — LLM-tuned snippets. List price is $0.005
    # per call; new accounts get $100 in onboarding credit (~20,000
    # calls before any charge). NOTE: You.com also offers an MCP
    # server at api.you.com/mcp with a no-key free tier (100 queries/
    # day at ?profile=free) — we don't proxy through it from this
    # REST driver, but agents can hit it directly.
    youcom:
        api_key_env: YDC_API_KEY
        base_url: https://ydc-index.io
        cost_per_call: 0.005

# Extract providers consumed by the frugal__extract MCP tool. Same
# routing rules as search: cheapest configured wins; any per-provider
# failure — transient or permanent (e.g. empty content → likely
# JS-rendered) — falls through to the next provider, and the error the
# agent sees names every provider that failed. The exception is a fatal
# request error (target URL gone — 404/410 from the site itself): no
# provider can fix that, so the chain stops without spending a paid call.
extract_providers:
    # Free / local: pure-Go Readability port. Fetches the URL with the
    # operator's HTTP client and runs an in-process content-extraction
    # pass. Returns Permanent on empty content (JS-rendered pages),
    # which lets the router fall through to a paid driver.
    goreadability:
        cost_per_call: 0.0
    # Premium paid: handles JS-rendered pages, anti-bot defenses, and
    # PDF / binary content. Operators set FIRECRAWL_API_KEY to enable.
    firecrawl:
        api_key_env: FIRECRAWL_API_KEY
        base_url: https://api.firecrawl.dev
        cost_per_call: 0.001

# Browse providers consumed by the frugal__browse MCP tool. Use this
# tool when the page needs JS execution to populate content (when
# frugal__extract returns empty / "page likely requires JS").
browse_providers:
    # Hosted headless Chrome. Handles JS, anti-bot waits, custom wait-
    # for selectors. Operators set BROWSERLESS_TOKEN to enable. Local
    # Playwright is deferred (binary install friction).
    browserless:
        api_key_env: BROWSERLESS_TOKEN
        base_url: https://chrome.browserless.io
        cost_per_call: 0.002
